# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json
# For more information, visit https://github.com/amnweb/yasb/wiki
watch_stylesheet: true
watch_config: true
debug: false
update_check: true
bars:
  primary-bar:
    enabled: true
    screens:
    - '*'
    class_name: yasb-bar
    alignment:
      position: top
      align: center
    animation:
      enabled: true
      duration: 300
    blur_effect:
      enabled: false
      round_corners: true
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: 100%
      height: 36
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
      - desktop_folder
      - lines
      - taskbar
      - media
      center:
      - clock
      right:
      - cava
      - systray
      - memory
      - quick_launch
      - notifications
      - power_menu
widgets:
  clock:
    type: yasb.clock.ClockWidget
    options:
      label: '{%Y.%m.%d %a %H:%M}<span>{alarm}</span>'
      label_alt: '{%Y.%m.%d %a %H:%M}'
      timezones: []
      calendar:
        blur: false
        round_corners: true
        alignment: center
        direction: down
        extended: false
        show_years: true
        show_holidays: false
        show_week_numbers: true
      callbacks:
        on_left: toggle_calendar
        on_middle: do_nothing
        on_right: do_nothing
  notifications:
    type: yasb.notifications.NotificationsWidget
    options:
      label: "<span>\ueb9a</span>"
      label_alt: '{count} notifications'
      hide_empty: true
      tooltip: false
      callbacks:
        on_left: toggle_notification
        on_right: do_nothing
        on_middle: do_nothing
  power_menu:
    type: yasb.power_menu.PowerMenuWidget
    options:
      label: "<span>\ueaf8</span>"
      uptime: true
      show_user: true
      menu_style: popup
      popup:
        blur: false
        direction: down
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: right
        offset_left: 12
      profile_image_size: 64
      buttons:
        lock:
        - "\uDB80\uDF41"
        - Lock
        signout:
        - "\uDB80\uDF43"
        - Sign out
        sleep:
        - "\uDB82\uDD04"
        - Sleep
        hibernate:
        - "\uDB82\uDD01"
        - Hibernate
        restart:
        - "\uDB81\uDC53"
        - Restart
        shutdown:
        - "\uDB82\uDD06"
        - Shut Down
        cancel:
        - ''
        - Cancel
  active_window:
      type: yasb.active_window.ActiveWindowWidget
      options:
        label: '{win[title]}'
        label_alt: '{win[title]}'
        label_no_window: ''
        label_icon: true
        label_icon_size: 16
        max_length: 32
        max_length_ellipsis: '...'
        monitor_exclusive: false
  win_button:
      type: "yasb.custom.CustomWidget"
      options:
        label: "\uf09b"
        label_alt: "\uf09b"
        class_name: "system-widget"
        callbacks:
          on_left: "exec start_menu"
  lines:
      type: "yasb.custom.CustomWidget"
      options:
        label: "\u007c"
        label_alt: "\u007c"
        class_name: "separator-widget"
        callbacks:
          on_left: "do_nothing"
  komorebi_workspaces:
      type: "komorebi.workspaces.WorkspaceWidget"
      options:
        label_offline: "Komorebi Offline"
        label_workspace_btn: "{index}"
        label_workspace_active_btn: "{index}"
        label_workspace_populated_btn: "{index}"
        label_default_name: ""
        label_zero_index: false
        hide_empty_workspaces: true
        hide_if_offline: false
        toggle_workspace_layer:
          enabled: false
          tiling_label: "Tiling"
          floating_label: "Floating"
        app_icons: 
          enabled_populated: false
          enabled_active: false
          size: 12
          max_icons: 0
          hide_label: false
          hide_duplicates: false
          hide_floating: false
  komorebi_active_layout:
      type: "komorebi.active_layout.ActiveLayoutWidget"
      options:
        hide_if_offline: true
        label: "{layout_name}"
        layouts: ['bsp', 'columns', 'rows', 'grid', 'vertical_stack', 'horizontal_stack', 'ultrawide_vertical_stack','right_main_vertical_stack']
        layout_icons:
          bsp: "\uebeb"
          columns: "\uebf7"
          rows: "\uec01"
          grid: "\udb81\udf58"
          scrolling: "\uebf7"
          vertical_stack: "\uebee"
          horizontal_stack: "\uebf0"
          ultrawide_vertical_stack: "\uebee"
          right_main_vertical_stack: "\uebf1"
          monocle: "\uf06f"
          maximized: "\uf06f"
          floating: "\uf2d2"
          paused: "\udb83\udf89"
          tiling: "\udb81\ude40"
        callbacks:
          on_left: 'toggle_layout_menu'
          on_middle: 'next_layout'
          on_right: 'prev_layout'
        layout_menu:
          blur: false
          round_corners: true
          round_corners_type: "normal"
          border_color: "System"
          alignment: "left"
          direction: "down"
          offset_top: 6
          offset_left: 0
          show_layout_icons: true
  cava:
      type: "yasb.cava.CavaWidget"
      options:
        bar_height: 15
        min_bar_height: 0
        gradient: 1
        foreground: "#89b4fa"
        gradient_color_1: '#ff00ff'
        gradient_color_2: '#ffb7c5'
        gradient_color_3: '#ff00ff'
        bars_number: 70
        bar_spacing: 2
        bar_width: 2
        bar_type: "bars"
        framerate: 300
        sleep_timer: 0
        hide_empty: true
  media:
      type: "yasb.media.MediaWidget"
      options:
        label: "{title}{s}{artist}"
        label_alt: "{title}{s}{artist}"
        separator: " - "
        hide_empty: true
        callbacks:
          on_left: "toggle_media_menu"
          on_middle: "do_nothing"
          on_right: "do_nothing"
        max_field_size:
          label: 45
          label_alt: 30
        show_thumbnail: false
        controls_only: false
        controls_left: true
        controls_hide: true
        thumbnail_alpha: 80
        thumbnail_padding: 8
        thumbnail_corner_radius: 16
        icons:
          prev_track: "\ue892"
          next_track: "\ue893"
          play: "\ue768"
          pause: "\ue769"
        media_menu:
          blur: false
          round_corners: false
          round_corners_type: "normal"
          border_color: "system"
          alignment: "right"
          direction: "down"
          offset_top: 6
          offset_left: 0
          thumbnail_corner_radius: 0
          thumbnail_size: 120
          max_title_size: 60
          max_artist_size: 50
          show_source: true
        media_menu_icons:
          play: "\udb81\udc0a"
          pause: "\udb80\udfe4"
          prev_track: "\udb81\udcae"
          next_track: "\udb81\udcad"
        scrolling_label:
          enabled: false
          update_interval_ms: 33
          style: "left"  # can be "left", "right", "bounce", "bounce-ease"
          separator: " | "
          label_padding: 0
          always_scroll: false
        # Easing curve params: https://www.desmos.com/calculator/j7eamemxzi
          ease_slope: 20
          ease_pos: 0.8
          ease_min: 0.5
        progress_bar:
          enabled: false       # Whether to enable the progress bar on the widget.
          alignment: "bottom"  # The alignment of the progress bar inside the widget container. Can be "top", "bottom", or "center".
  memory:
      type: "yasb.memory.MemoryWidget"
      options:
        label: "<span>\uf2db</span>{virtual_mem_used}"
        label_alt: "<span>\uf2db</span>{virtual_mem_used} | {virtual_mem_percent}%"
        update_interval: 2000
        hide_decimal: false
        label_shadow:
          enabled: true
          color: "black"
          radius: 3
          offset: [1, 1]
        callbacks:
          on_left: "toggle_menu"
          on_middle: "toggle_label"
          on_right: "exec start ms-settings:about"
        menu:
          enabled: true
          blur: true
          round_corners: true
          round_corners_type: "normal"
          border_color: "System"
          alignment: "right"
          direction: "down"
          offset_top: 7
          offset_left: 0
          graph_history_size: 60
          show_graph: true
          show_graph_grid: false
          pin_icon: "\ue718"
          unpin_icon: "\ue77a"
  quick_launch:
      type: "yasb.quick_launch.QuickLaunchWidget"
      options:
        label: "<span>\uf002</span>"
        search_placeholder: "Search applications..."
        max_results: 30
        show_icons: true
        icon_size: 32
        popup:
          width: 650
          height: 400
          blur: false
          round_corners: true
          round_corners_type: "normal"
          border_color: "system"
          dark_mode: true
        callbacks:
          on_left: "toggle_quick_launch"
        keybindings:
          - keys: "alt+space"
            action: "toggle_quick_launch"
            screen: "primary"
  systray:
      type: "yasb.systray.SystrayWidget"
      options:
        class_name: "systray"
        label_collapsed: "\uf106"
        label_expanded: "\uf107"
        label_position: "right"
        icon_size: 16
        pin_click_modifier: "alt"
        show_unpinned: false
        show_unpinned_button: true
        show_battery: true
        show_volume: true
        show_network: true
        use_hook: true
        icons_per_row: 4
        hide_icons: []
        popup:
          blur: false
          round_corners: true
          round_corners_type: "normal"
          border_color: "System"
          alignment: "center"
          direction: "down"
          offset_top: 6
          offset_left: 0
  taskbar:
      type: "yasb.taskbar.TaskbarWidget"
      options:
        icon_size: 16
        tooltip: false
        show_only_visible: true
        strict_filtering: true
        monitor_exclusive: true
        hide_empty: true
        animation:
          enabled: true
          duration: 200
        preview:
          enabled: true
          width: 240
          delay: 400
          padding: 8
          margin: 8
        title_label:
          enabled: false
          show: "focused"
          min_length: 10
          max_length: 30
        callbacks:
          on_left: "toggle_window"
          on_middle: "do_nothing"
          on_right: "close_app"
        ignore_apps:
          processes: []
          titles: []
          classes: []
  desktop_folder:
      type: "yasb.custom.CustomWidget"
      options:
        label: "<span>\uf108</span>"
        label_alt: "<span>\uf108</span>"
        class_name: "desktop-folder-widget"
        callbacks:
          on_left: "exec explorer.exe D:\\Desktop\\za\\桌面图标"
          on_right: "do_nothing"
