# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json
# For more information, visit https://github.com/amnweb/yasb/wiki
watch_stylesheet: true
watch_config: true
debug: false
update_check: true
bars:
  primary-bar:
    enabled: true
    screens:
    - '*'
    class_name: yasb-bar dynamic-island
    alignment:
      position: top
      align: left
    animation:
      enabled: true
      duration: 300
    blur_effect:
      enabled: false
      round_corners: true
    window_flags:
      always_on_top: true
      windows_app_bar: true
    dimensions:
      width: 100%
      height: 38
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
      - desktop_folder
      - app_collapse
      - taskbar
      - media
      center: []
      right:
      - cava
      - memory
      - notifications
      - systray
      - power_menu
  clock-bar:
    enabled: true
    screens:
    - '*'
    class_name: yasb-bar clock-island
    alignment:
      position: top
      align: center
    animation:
      enabled: true
      duration: 300
    blur_effect:
      enabled: false
      round_corners: true
    window_flags:
      always_on_top: true
    dimensions:
      width: auto
      height: 38
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
      - clock2
      center: []
      right: []
widgets:
  clock:
    type: yasb.clock.ClockWidget
    options:
      label: '{%Y.%m.%d %a %H:%M}<span>{alarm}</span>'
      label_alt: '{%Y.%m.%d %a %H:%M}'
      timezones: []
      calendar:
        blur: false
        round_corners: true
        alignment: center
        direction: down
        extended: false
        show_years: true
        show_holidays: false
        show_week_numbers: true
      callbacks:
        on_left: toggle_calendar
        on_middle: do_nothing
        on_right: do_nothing
  clock2:
    type: yasb.clock.ClockWidget
    options:
      label: '{%Y.%m.%d %a %H:%M}<span>{alarm}</span>'
      label_alt: '{%Y.%m.%d %a %H:%M}'
      timezones: []
      calendar:
        blur: false
        round_corners: true
        alignment: center
        direction: down
        extended: false
        show_years: true
        show_holidays: false
        show_week_numbers: true
      callbacks:
        on_left: toggle_calendar
        on_middle: do_nothing
        on_right: do_nothing
  notifications:
    type: yasb.notifications.NotificationsWidget
    options:
      label: "<span>\ueb9a</span>"
      label_alt: '{count} notifications'
      hide_empty: true
      tooltip: false
      callbacks:
        on_left: toggle_notification
        on_right: do_nothing
        on_middle: do_nothing
  power_menu:
    type: yasb.power_menu.PowerMenuWidget
    options:
      label: "<span>\ueaf8</span>"
      uptime: true
      show_user: true
      menu_style: popup
      popup:
        blur: false
        direction: down
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: right
        offset_left: 12
      profile_image_size: 64
      buttons:
        lock:
        - "\uDB80\uDF41"
        - 锁  定
        signout:
        - "\uDB80\uDF43"
        - 注  销
        sleep:
        - "\uDB82\uDD04"
        - 睡  眠
        hibernate:
        - "\uDB82\uDD01"
        - 休  眠
        restart:
        - "\uDB81\uDC53"
        - 重  启
        shutdown:
        - "\uDB82\uDD06"
        - 关  机
        cancel:
        - ''
        - 取  消
  cava:
      type: "yasb.cava.CavaWidget"
      options:
        bar_height: 15
        min_bar_height: 0
        gradient: 1
        foreground: "#89b4fa"
        gradient_color_1: '#7aa2f7'
        gradient_color_2: '#89ddff'
        gradient_color_3: '#c0caf5'
        bars_number: 70
        bar_spacing: 2
        bar_width: 2
        bar_type: "bars"
        framerate: 300
        sleep_timer: 0
        hide_empty: true
  media:
      type: "yasb.media.MediaWidget"
      options:
        label: "{title}{s}{artist}"
        label_alt: "{title}{s}{artist}"
        separator: " - "
        hide_empty: true
        callbacks:
          on_left: "toggle_media_menu"
          on_middle: "do_nothing"
          on_right: "do_nothing"
        max_field_size:
          label: 33
          label_alt: 30
        show_thumbnail: false
        controls_only: false
        controls_left: true
        controls_hide: true
        thumbnail_alpha: 80
        thumbnail_padding: 8
        thumbnail_corner_radius: 16
        icons:
          prev_track: "\ue892"
          next_track: "\ue893"
          play: "\ue768"
          pause: "\ue769"
        media_menu:
          blur: false
          round_corners: false
          round_corners_type: "normal"
          border_color: "system"
          alignment: "right"
          direction: "down"
          offset_top: 6
          offset_left: 0
          thumbnail_corner_radius: 0
          thumbnail_size: 120
          max_title_size: 60
          max_artist_size: 50
          show_source: true
        media_menu_icons:
          play: "\udb81\udc0a"
          pause: "\udb80\udfe4"
          prev_track: "\udb81\udcae"
          next_track: "\udb81\udcad"
        scrolling_label:
          enabled: true
          update_interval_ms: 45
          style: "bounce-ease"  # can be "left", "right", "bounce", "bounce-ease"
          separator: " | "
          label_padding: 0
          always_scroll: false
        # Easing curve params: https://www.desmos.com/calculator/j7eamemxzi
          ease_slope: 20
          ease_pos: 0.8
          ease_min: 0.95
        progress_bar:
          enabled: false       # Whether to enable the progress bar on the widget.
          alignment: "bottom"  # The alignment of the progress bar inside the widget container. Can be "top", "bottom", or "center".
  memory:
      type: "yasb.memory.MemoryWidget"
      options:
        label: "<span>\uf2db</span>{virtual_mem_used}"
        label_alt: "<span>\uf2db</span>{virtual_mem_used} | {virtual_mem_percent}%"
        update_interval: 2000
        hide_decimal: false
        callbacks:
          on_left: "toggle_menu"
          on_middle: "toggle_label"
          on_right: "exec start ms-settings:about"
        menu:
          enabled: true
          blur: true
          round_corners: true
          round_corners_type: "normal"
          border_color: "System"
          alignment: "right"
          direction: "down"
          offset_top: 7
          offset_left: 0
          graph_history_size: 60
          show_graph: true
          show_graph_grid: false
          pin_icon: "\ue718"
          unpin_icon: "\ue77a"
  systray:
      type: "yasb.systray.SystrayWidget"
      options:
        class_name: "systray"
        label_collapsed: "\uf053"
        label_expanded: "\uf054"
        label_position: "right"
        icon_size: 16
        pin_click_modifier: "alt"
        show_unpinned: false
        show_unpinned_button: true
        show_battery: true
        show_volume: true
        show_network: true
        use_hook: true
        icons_per_row: 4
        hide_icons: []
        popup:
          blur: true
          round_corners: true
          round_corners_type: "normal"
          border_color: "System"
          alignment: "center"
          direction: "down"
          offset_top: 6
          offset_left: 0
  taskbar:
      type: "yasb.taskbar.TaskbarWidget"
      options:
        icon_size: 16
        tooltip: false
        show_only_visible: true
        strict_filtering: true
        monitor_exclusive: true
        hide_empty: true
        animation:
          enabled: true
          duration: 200
        preview:
          enabled: true
          width: 240
          delay: 400
          padding: 8
          margin: 8
        title_label:
          enabled: false
          show: "focused"
          min_length: 10
          max_length: 30
        callbacks:
          on_left: "toggle_window"
          on_middle: "do_nothing"
          on_right: "close_app"
        ignore_apps:
          processes: []
          titles: []
          classes: []
  desktop_folder:
      type: "yasb.custom.CustomWidget"
      options:
        label: "<span>\uf108</span>"
        label_alt: "<span>\uf108</span>"
        class_name: "desktop-folder-widget"
        callbacks:
          on_left: "exec explorer.exe C:\\example\\example\\该目录下的某个文件夹"
          on_right: &app_sort 'exec "C:\Users\10932\AppData\Local\Programs\Python\Python314\pythonw.exe" -c "import sys;exec(bytes.fromhex(sys.argv[1]).decode())" '
  app_collapse:
      type: "yasb.grouper.GrouperWidget"
      options:
        class_name: "app-collapser"
        widgets:
          - example
        hide_empty: false
        collapse_options:
          enabled: true
          exclude_widgets: []
          expanded_label: "\uf053"
          collapsed_label: "\uf054"
          label_position: "left"
# 此行下方是设置左侧固定图标的，其他软件的设置方法同下方 example一致
  example:
      type: "yasb.custom.CustomWidget"
      options:
        label: '<img src="file:///C:/Users/xxxxx/.config/yasb/icons/example.png" width="16" height="16">'
        label_alt: '<img src="file:///C:/Users/xxxxx/.config/yasb/icons/example.png" width="16" height="16">'
        class_name: "app-shortcut-widget"
        callbacks:
          on_left: 'exec "C:\example.exe"'
          on_middle: "do_nothing"
          on_right: *app_sort
